{% extends 'blogs/base.html' %}

{% block title %}Каталог записей{% endblock %}

{% block content %}

<div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        {% for blog in object_list %}
        <div class="col">
            <div class="card shadow-sm">
                <img src="{{ blogs.image.url }}" class="card-img-top" alt="{{ blogs.title }}" height="225" style="width: 100%; object-fit: contain;">
                <div class="card-body"><p class="card-text">{{blogs.title}} : {{blogs.content|truncatechars:100}}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                           <a class="btn btn-primary" href="{% url 'blogs:blogs_detail' blogs.pk %}" role="button">Подробнее</a>

                        </div>
                        <small class="text-body-secondary">9 mins</small></div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
