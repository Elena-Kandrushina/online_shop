{% extends 'base.html' %}

{% block title %}Каталог{% endblock %}

{% block content %}

<div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">

        <div class="col">
            <div class="card shadow-sm">
                <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}" height="225" style="object-fit: contain;">
                <div class="card-body">
                    <p class="card-text">Наименование: {{product.name}} : {{product.description}}</p>
                    <p class="card-text">Категория: {{product.category}}</p>
                    <p class="card-text">Цена: {{product.price}}</p>
                    <p class="card-text">Дата создания: {{product.created_at}}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                            <a class="btn btn-primary" href="{% url 'catalog:products_list' %}" role="button">Назад</a>

                        </div>
                        <small class="text-body-secondary">9 mins</small></div>
                </div>
            </div>
        </div>

    </div>
</div>

{% endblock %}
