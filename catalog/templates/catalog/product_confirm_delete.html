{% extends 'catalog/base.html' %}

{% block title %}Удалить продукт{% endblock %}

{% block content %}
<div class="container">
    <h2>Удалить продукт: {{ object.name }}</h2>
    <p>Вы уверены, что хотите удалить этот продукт?</p>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a class="btn btn-secondary" href="{% url 'catalog:products_list' %}">Отмена</a>
    </form>
</div>
{% endblock %}
